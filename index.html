<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Vert</title>
</head>
<body>
    <main class="content">
        <header>
            <h1>Vert Accesorios</h1>
            <p class="subtitle">Collares</p>
        </header>

        <ul class="catalog" aria-label="Catálogo de accesorios">
            <li class="catalog-item">
                <figure>
                    <img src="./images/kitty.jpeg" alt="Collar estilo Hello Kitty">
                    <figcaption>
                        <span class="item-price">$9.000</span>
                    </figcaption>
                </figure>
            </li>
            <li class="catalog-item">
                <figure>
                    <img src="./images/estrella.jpeg" alt="Collar con diseño de estrella">
                    <figcaption>
                        <span class="item-price">$7.000</span>
                    </figcaption>
                </figure>
            </li>
            <li class="catalog-item">
                <figure>
                    <img src="./images/estrellas.jpeg" alt="Collar con diseño de varias estrellas">
                    <figcaption>
                        <span class="item-price">$6.000</span>
                    </figcaption>
                </figure>
            </li>
            <li class="catalog-item">
                <figure>
                    <img src="./images/rosas.jpeg" alt="Collar con diseño de rosas">
                    <figcaption>
                        <span class="item-price">$6.000</span>
                    </figcaption>
                </figure>
            </li>
            <li class="catalog-item">
                <figure>
                    <img src="./images/puas.jpeg" alt="Collar con diseño de puas">
                    <figcaption>
                        <span class="item-price">$7.000</span>
                    </figcaption>
                </figure>
            </li>
            <li class="catalog-item">
                <figure>
                    <img src="./images/daga.jpeg" alt="Daga decorativa">
                    <figcaption>
                        <span class="item-price">$6.000</span>
                    </figcaption>
                </figure>
            </li>
        </ul>

        <p class="subtitle">Cadenas para pantalon</p>
        <ul class="catalog" aria-label="Catálogo de accesorios">
            <li class="catalog-item">
                <figure>
                    <img src="./images/pants/doble.jpeg" alt="Cadena pantalon doble">
                    <figcaption>
                        <span class="item-price">$9.000</span>
                    </figcaption>
                </figure>
            </li>
            <li class="catalog-item">
                <figure>
                    <img src="./images/pants/simple.jpeg" alt="Cadena pantalon simple">
                    <figcaption>
                        <span class="item-price">$7.000</span>
                    </figcaption>
                </figure>
            </li>
            <li class="catalog-item">
                <figure>
                    <img src="./images/pants/cruz.jpeg" alt="Cadena pantalon cruz">
                    <figcaption>
                        <span class="item-price">$12.000</span>
                    </figcaption>
                </figure>
            </li>
            <li class="catalog-item">
                <figure>
                    <img src="./images/pants/puas.jpeg" alt="Cadena pantalon puas">
                    <figcaption>
                        <span class="item-price">$9.000</span>
                    </figcaption>
                </figure>
            </li>
            <li class="catalog-item">
                <figure>
                    <img src="./images/pants/estrellas.jpeg" alt="Cadena pantalon estrellas">
                    <figcaption>
                        <span class="item-price">$7.000</span>
                    </figcaption>
                </figure>
            </li>
            <li class="catalog-item">
                <figure>
                    <img src="./images/pants/colgantes.jpeg" alt="Cadena pantalon colgantes">
                    <figcaption>
                        <span class="item-price">$6.000</span>
                    </figcaption>
                </figure>
            </li>
        </ul>

    </main>
</body>
</html>
